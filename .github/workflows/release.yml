name: 同步作者并发布 Windows

on:
  push:
    branches: [main]
    paths: ['.github/personal/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '作者正式版标签；留空自动使用最新正式版，例如 v0.6.3'
        required: false
        type: string
      rebuild:
        description: '没有新正式版时也重新打包，生成新的 sortfix 修订'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: personal-windows-update
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'XuShall/cc-sessions-viewer' && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.AUTO_UPDATE == 'true')
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      tag: ${{ steps.prepare.outputs.tag }}
    env:
      HUSKY: '0'
      CARGO_TERM_COLOR: always
      PERSONAL_RESULT: ${{ github.workspace }}/personal-result
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 验证同步脚本与冲突停止规则
        run: python .github/personal/sync.py self-test
      - name: 获取作者正式版并迁移定制功能
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          REBUILD: '${{ inputs.rebuild || false }}'
        run: python .github/personal/sync.py prepare
      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prepare.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.prepare.outputs.changed == 'true'
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: 云端安装前端依赖
        if: steps.prepare.outputs.changed == 'true'
        run: npm ci
      - name: 前端类型检查
        if: steps.prepare.outputs.changed == 'true'
        run: npx vue-tsc --noEmit
      - name: 验证回复排序、Markdown 导出和原有界面
        if: steps.prepare.outputs.changed == 'true'
        run: npm run test:run -- test/export.test.ts test/components/SettingsModal.test.ts test/sessionsToolbar.test.ts test/sessionListLoading.test.ts test/components/SessionsTopbar.test.ts test/views/SessionsView.test.ts test/i18n.test.ts test/api.test.ts test/updateCheck.test.ts test/agentMeta.test.ts test/chatComposerOptions.test.ts test/chatContext.test.ts test/chatGuiPreferences.test.ts test/chatSessions.test.ts test/components/ChatComposer.test.ts test/components/SideChatInput.test.ts test/composerInput.test.ts test/views/PricingView.test.ts test/sessionStars.test.ts test/sessionStarLayout.test.ts test/tooltip.test.ts
      - name: 验证 Codex 回复时间、恢复会话与存储兼容
        if: steps.prepare.outputs.changed == 'true'
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib agents::codex:: -- --nocapture'
      - name: 验证作者的 OpenCode 历史兼容
        if: steps.prepare.outputs.changed == 'true'
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib agents::opencode:: -- --nocapture'
      - name: 仅编译 Windows x64 安装包
        if: steps.prepare.outputs.changed == 'true'
        run: npm run tauri build -- --bundles nsis
      - name: 核对测试源码并生成便携版和校验文件
        if: steps.prepare.outputs.changed == 'true'
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build changed tracked source files' }
          $plan = Get-Content -LiteralPath "$env:PERSONAL_RESULT/plan.json" -Raw | ConvertFrom-Json -AsHashtable
          $actualTree = (git write-tree).Trim()
          if ($actualTree -ne $plan.tree) { throw 'Built source differs from the candidate plan' }
          $binary = Get-ChildItem -LiteralPath src-tauri/target/release -File -Filter '*.exe' | Where-Object { $_.BaseName -in @('cc-sessions-viewer', 'Sessions Viewer') } | Select-Object -First 1
          if (-not $binary) { throw 'Windows executable was not found' }
          $portableDir = Join-Path $env:RUNNER_TEMP 'personal-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $portableDir 'Sessions Viewer.exe')
          Compress-Archive -LiteralPath (Join-Path $portableDir 'Sessions Viewer.exe') -DestinationPath "$env:PERSONAL_RESULT/Sessions.Viewer_$($plan.version)_x64_portable.zip"
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $env:PERSONAL_RESULT $installer.Name.Replace(' ', '.'))
          }
          Get-ChildItem -LiteralPath $env:PERSONAL_RESULT -File | Where-Object { $_.Extension -in @('.zip', '.exe') } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath "$env:PERSONAL_RESULT/SHA256SUMS.txt" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: verified-personal-windows
          path: |
            ${{ github.workspace }}/personal-result/*-setup.exe
            ${{ github.workspace }}/personal-result/*_portable.zip
            ${{ github.workspace }}/personal-result/SHA256SUMS.txt
            ${{ github.workspace }}/personal-result/source.patch
            ${{ github.workspace }}/personal-result/plan.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PERSONAL_RESULT: ${{ github.workspace }}/personal-result
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-personal-windows
          path: ${{ github.workspace }}/personal-result
      - name: 保留一个定制提交并发布经过验证的 Windows 下载包
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/personal/sync.py publish
