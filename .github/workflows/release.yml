name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use v plus the package version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      HUSKY: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json -AsHashtable).version
          $tauriVersion = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable).version
          if ($packageVersion -ne $tauriVersion) { throw 'Package and Tauri versions differ' }
          $releaseTag = "v$packageVersion"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $releaseTag = $env:GITHUB_REF_NAME }
          elseif ($env:REQUESTED_TAG) { $releaseTag = $env:REQUESTED_TAG }
          if ($releaseTag -ne "v$packageVersion") { throw "Tag must match v$packageVersion" }
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Test session sorting and update checks
        run: npm run test:run -- test/sessionsToolbar.test.ts test/updateCheck.test.ts test/api.test.ts
      - name: Test Codex compatibility and last-reply ordering
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib agents::codex::tests -- --nocapture
      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
      - name: Package installer, portable executable and checksums
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json -AsHashtable).version
          New-Item -ItemType Directory -Force -Path dist-release, dist-release/portable | Out-Null
          $binary = Get-ChildItem -LiteralPath src-tauri/target/release -File -Filter '*.exe' |
            Where-Object { $_.BaseName -in @('cc-sessions-viewer', 'Sessions Viewer') } |
            Select-Object -First 1
          if (-not $binary) { throw 'Compiled Windows executable was not found' }
          Copy-Item -LiteralPath $binary.FullName -Destination 'dist-release/portable/Sessions Viewer.exe'
          Compress-Archive -LiteralPath 'dist-release/portable/Sessions Viewer.exe' -DestinationPath "dist-release/Sessions.Viewer_${packageVersion}_x64_portable.zip"
          $installers = Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe'
          if (-not $installers) { throw 'Windows installer was not found' }
          foreach ($installer in $installers) {
            $assetName = $installer.Name.Replace(' ', '.')
            Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path dist-release $assetName)
          }
          Get-ChildItem -LiteralPath dist-release -File | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -LiteralPath dist-release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist-release/*-setup.exe
            dist-release/*_portable.zip
            dist-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist-release
      - name: Publish personal Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Sessions Viewer ${{ needs.build.outputs.release_tag }} (Windows)
          draft: false
          prerelease: false
          body: |
            Windows x64 personal build of Sessions Viewer.

            - Sort Codex sessions by the last completed assistant reply.
            - Ignore later settings, progress messages, tools and pending questions.
            - Handle escaped message text and legacy Codex transcript formats.
            - Run Codex regression tests and frontend checks in GitHub Actions.

            Download the setup executable or the portable ZIP. SHA256SUMS.txt contains the checksums.
            Updates are installed manually from this fork's Releases; updater signing is disabled.
          files: |
            dist-release/*-setup.exe
            dist-release/*_portable.zip
            dist-release/SHA256SUMS.txt
          fail_on_unmatched_files: true
