name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HUSKY: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type-check frontend
        run: npx vue-tsc --noEmit
      - name: Test session sorting and update checks
        run: npm run test:run -- test/sessionsToolbar.test.ts test/updateCheck.test.ts test/api.test.ts
      - name: Test Codex compatibility and last-reply ordering
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib agents::codex::tests -- --nocapture
